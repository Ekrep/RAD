<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity Web Player | TestBridge</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"> </div>
    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">TestBridge</div>
    </div>
  </div>
  <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
  <script>
    // ───────────────────────────
    // Unity loader
    // ───────────────────────────
    var canvas = document.querySelector("#unity-canvas");

    // Shows a temporary message banner/ribbon for a few seconds, or
    // a permanent error message on top of the canvas if type=='error'.
    // If type=='warning', a yellow highlight color is used.
    // Modify or remove this function to customize the visually presented
    // way that non-critical warnings and error messages are presented to the
    // user.
    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/bld.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/bld.data",
      frameworkUrl: buildUrl + "/bld.framework.js",
      codeUrl: buildUrl + "/bld.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "TestBridge",
      productVersion: "0.1.0",
      showBanner: unityShowBanner,
      // errorHandler: function(err, url, line) {
      //    alert("error " + err + " occurred at line " + line);
      //    // Return 'true' if you handled this error and don't want Unity
      //    // to process it further, 'false' otherwise.
      //    return true;
      // },
    };

    // By default, Unity keeps WebGL canvas render target size matched with
    // the DOM size of the canvas element (scaled by window.devicePixelRatio)
    // Set this to false if you want to decouple this synchronization from
    // happening inside the engine, and you would instead like to size up
    // the canvas DOM size and WebGL render target sizes yourself.
    // config.matchWebGLToCanvasSize = false;

    // If you would like all file writes inside Unity Application.persistentDataPath
    // directory to automatically persist so that the contents are remembered when
    // the user revisits the site the next time, uncomment the following line:
    // config.autoSyncPersistentDataPath = true;
    // This autosyncing is currently not the default behavior to avoid regressing
    // existing user projects that might rely on the earlier manual
    // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
    // expected to change.

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      // Mobile device style: fill the whole browser client area with the game canvas:

      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";

      // To lower canvas resolution on mobile devices to gain some
      // performance, uncomment the following line:
      // config.devicePixelRatio = 1;


    } else {
      // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
      canvas.style.width = "960px";
      canvas.style.height = "600px";
    }
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (p) => {
        document.querySelector("#unity-progress-bar-full").style.width = (100 * p) + "%";
      })
        .then(async (unityInstance) => {
          // Unity hazır
          window.unityInstance = unityInstance;
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => unityInstance.SetFullscreen(1);

          // JS→Unity
          window.callUnity = (msg) => {
            try { window.unityInstance?.SendMessage("Bridge", "OnMessage", String(msg)); } catch { }
          };

          // ——— Kamera (CAPTURE 320x240, EKRANDA 640x480) ———
          const CAP_W = 320, CAP_H = 240;    // gerçek akış
          const CSS_W = 640, CSS_H = 480;    // ekranda gösterim
          const video = document.createElement("video");
          Object.assign(video, { autoplay: true, playsInline: true, muted: true, width: CAP_W, height: CAP_H });
          Object.assign(video.style, {
            position: "fixed", left: "12px", bottom: "12px",
            width: CSS_W + "px", height: CSS_H + "px", borderRadius: "8px", background: "#000",
            display: "none", zIndex: 9998
          });
          document.body.appendChild(video);

          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { width: CAP_W, height: CAP_H, frameRate: { ideal: 30, max: 30 } }, audio: false
            });
            video.srcObject = stream; await video.play();
          } catch (err) { console.error("Kamera açılamadı:", err); return; }

          // ——— UI Etiketi ———
          const bar = document.createElement("div");
          Object.assign(bar.style, { position: "fixed", right: "12px", top: "12px", zIndex: 9999, display: "flex", gap: "8px", alignItems: "center" });
          const lbl = document.createElement("div");
          Object.assign(lbl.style, { padding: "8px 10px", background: "rgba(0,0,0,.6)", color: "#fff", fontFamily: "monospace", fontSize: "14px", borderRadius: "8px" });
          lbl.textContent = "IPD: --";
          bar.appendChild(lbl); document.body.appendChild(bar);

          // ————————— IPD (MediaPipe) —————————
          let PX_TO_MM = null;                       // OpenCV ölçeği buraya düşer
          window.setPxToMm = (v) => { PX_TO_MM = v; lastCardUpdate = performance.now(); };

          const LEFT_IRIS = [468, 469, 470, 471, 472], RIGHT_IRIS = [473, 474, 475, 476, 477];
          const LEFT_EYE_OUTER = 263, RIGHT_EYE_OUTER = 33;

          const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
          const toPx = (p) => ({ x: clamp(p.x, 0, 1) * CAP_W, y: clamp(p.y, 0, 1) * CAP_H });
          const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
          const avg = (pts) => ({ x: pts.reduce((s, p) => s + p.x, 0) / pts.length, y: pts.reduce((s, p) => s + p.y, 0) / pts.length });

          function irisData(landmarks) {
            if (!landmarks || landmarks.length < 478) return null;
            const L = LEFT_IRIS.map(i => toPx(landmarks[i]));
            const R = RIGHT_IRIS.map(i => toPx(landmarks[i]));
            const lc = avg(L), rc = avg(R);
            const lR = L.reduce((s, p) => s + dist(lc, p), 0) / L.length;
            const rR = R.reduce((s, p) => s + dist(rc, p), 0) / R.length;
            const eyeOuterPx = dist(toPx(landmarks[LEFT_EYE_OUTER]), toPx(landmarks[RIGHT_EYE_OUTER]));
            return { ipdPx: dist(lc, rc), irisDiamPx: 2 * ((lR + rR) * 0.5), eyeOuterPx };
          }

          // smoothing (Medyan + EMA)
          const MED_N = 5; let ema = null; const alpha = 0.35; const ipdQueue = [];
          function smooth(v) {
            ipdQueue.push(v); if (ipdQueue.length > 10) ipdQueue.shift();
            const lastK = ipdQueue.slice(-MED_N).slice().sort((a, b) => a - b);
            const med = lastK[Math.floor(lastK.length / 2)];
            ema = (ema == null) ? med : (alpha * med + (1 - alpha) * ema);
            return ema;
          }

          let IRIS_CAL_PX = null, EYE_CAL_PX = null;
          function setBaselinesIfNeeded(d) {
            if (IRIS_CAL_PX == null && d.irisDiamPx > 0) IRIS_CAL_PX = d.irisDiamPx;
            if (EYE_CAL_PX == null && d.eyeOuterPx > 0) EYE_CAL_PX = d.eyeOuterPx;
          }

          // MediaPipe
          const { FilesetResolver, FaceLandmarker } = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest");
          const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
          const landmarker = await FaceLandmarker.createFromOptions(fs, {
            baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" },
            runningMode: "VIDEO", numFaces: 1
          });

          // ————————— OpenCV (SÜPER HAFİF) —————————
          // 160x120 işlem, 1000ms periyot, stabilse periyodu artır.
          const A_MM = 85.60 * 53.98, TARGET_RATIO = 85.60 / 53.98, RATIO_TOL = 0.28;
          const OCv_W = 160, OCv_H = 120;
          let cvReady = false, src = null, small = null, gray = null, blr = null, edges = null, hier = null, contours = null;
          let lastCardUpdate = 0;
          let cvIntervalMs = 1000;         // başlangıç periyodu
          let cvTimer = null;

          function startOpenCV() {
            if (cvReady) return;
            cvReady = true;

            src = new cv.Mat(CAP_H, CAP_W, cv.CV_8UC4);
            small = new cv.Mat(OCv_H, OCv_W, cv.CV_8UC4);
            gray = new cv.Mat(OCv_H, OCv_W, cv.CV_8UC1);
            blr = new cv.Mat(OCv_H, OCv_W, cv.CV_8UC1);
            edges = new cv.Mat(OCv_H, OCv_W, cv.CV_8UC1);
            hier = new cv.Mat();
            contours = new cv.MatVector();

            // Canvas’tan frame çekimi (getImageData), ama 160x120’e direkt çizeceğiz.
            const grab = document.createElement("canvas");
            grab.width = OCv_W; grab.height = OCv_H;
            const gctx = grab.getContext("2d");

            function runOnce() {
              // Video’dan 160x120’e direkt çiz
              gctx.drawImage(video, 0, 0, OCv_W, OCv_H);
              const frame = gctx.getImageData(0, 0, OCv_W, OCv_H);
              small.data.set(frame.data);

              // gray + blur + canny
              cv.cvtColor(small, gray, cv.COLOR_RGBA2GRAY);
              cv.GaussianBlur(gray, blr, new cv.Size(3, 3), 0);
              cv.Canny(blr, edges, 45, 110);

              // konturlar
              contours.delete(); contours = new cv.MatVector();
              cv.findContours(edges, contours, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

              let bestArea = -1;
              for (let i = 0; i < contours.size(); i++) {
                const c = contours.get(i);
                const area = cv.contourArea(c);
                if (area < (OCv_W * OCv_H * 0.06)) { c.delete(); continue; } // %6 altında ele

                const peri = cv.arcLength(c, true);
                const approx = new cv.Mat();
                cv.approxPolyDP(c, approx, 0.02 * peri, true);

                if (approx.rows === 4 && cv.isContourConvex(approx)) {
                  const pts = []; for (let k = 0; k < 4; k++) { const p = approx.intPtr(k); pts.push({ x: p[0], y: p[1] }); }
                  // sırala
                  pts.sort((a, b) => a.y - b.y);
                  const top = pts.slice(0, 2).sort((a, b) => a.x - b.x);
                  const bot = pts.slice(2).sort((a, b) => a.x - b.x);
                  const q = [top[0], top[1], bot[1], bot[0]];
                  // oran
                  const w = 0.5 * (Math.hypot(q[0].x - q[1].x, q[0].y - q[1].y) + Math.hypot(q[3].x - q[2].x, q[3].y - q[2].y));
                  const h = 0.5 * (Math.hypot(q[1].x - q[2].x, q[1].y - q[2].y) + Math.hypot(q[0].x - q[3].x, q[0].y - q[3].y));
                  if (h < 1) { approx.delete(); c.delete(); continue; }
                  const ratio = w / h;
                  const ok = (ratio > TARGET_RATIO * (1 - RATIO_TOL) && ratio < TARGET_RATIO * (1 + RATIO_TOL))
                    || (1 / ratio > TARGET_RATIO * (1 - RATIO_TOL) && 1 / ratio < TARGET_RATIO * (1 + RATIO_TOL));
                  if (!ok) { approx.delete(); c.delete(); continue; }

                  // alan
                  let s = 0; for (let j = 0; j < 4; j++) { const k = (j + 1) & 3; s += q[j].x * q[k].y - q[k].x * q[j].y; }
                  const A_proc = Math.abs(s) / 2;  // 160x120 alanı
                  if (A_proc > bestArea) bestArea = A_proc;
                }
                approx.delete(); c.delete();
              }

              if (bestArea > 0) {
                // mm/px (CAP_W×CAP_H'e ölçekle: CAP/OCv oranlarıyla px alanını büyüt)
                const scaleX = CAP_W / OCv_W, scaleY = CAP_H / OCv_H;
                const A_full = bestArea * (scaleX * scaleY);
                const mmPerPx = Math.sqrt(A_MM / A_full);
                if (Number.isFinite(mmPerPx) && mmPerPx > 0 && mmPerPx < 2) {
                  window.setPxToMm(mmPerPx);

                  // stabil görürsek periyodu artır (en fazla 3000ms)
                  const now = performance.now();
                  if (now - lastCardUpdate < 500) {
                    cvIntervalMs = Math.min(3000, cvIntervalMs + 250);
                  } else {
                    cvIntervalMs = 1000; // uzun süre güncelleme yoksa tekrar hızlan
                  }
                }
              }

              // bir sonraki çalıştırma
              cvTimer = setTimeout(runOnce, cvIntervalMs);
            }

            // ilk tetikleme
            cvTimer = setTimeout(runOnce, cvIntervalMs);
          }

          // OpenCV hazır olunca başlat
          function waitCV() {
            if (window.cv && cv.Mat) {
              cv['onRuntimeInitialized'] = startOpenCV;
            } else {
              const iv = setInterval(() => { if (window.cv && cv.Mat) { clearInterval(iv); cv['onRuntimeInitialized'] = startOpenCV; } }, 50);
            }
          }
          waitCV();

          // ————————— Tek Döngü (rVFC) —————————
          let frameCounter = 0;
          function ipdLoop(ts, meta) {
            if (video.readyState >= 2) {
              // MediaPipe: her frame
              const res = landmarker.detectForVideo(video, performance.now());
              const face = res?.faceLandmarks?.[0];

              if (face) {
                const d = irisData(face);
                if (d && d.irisDiamPx > 0 && d.eyeOuterPx > 0) {
                  setBaselinesIfNeeded(d);

                  // px→mm
                  let pxToMm;
                  if (PX_TO_MM && IRIS_CAL_PX) {
                    let ratioDepth = IRIS_CAL_PX / d.irisDiamPx;
                    ratioDepth = clamp(ratioDepth, 0.6, 1.7);
                    pxToMm = PX_TO_MM * ratioDepth;
                  } else if (PX_TO_MM) {
                    pxToMm = PX_TO_MM;
                  } else {
                    pxToMm = 11.7 / d.irisDiamPx; // fallback
                  }

                  let yawFactor = (EYE_CAL_PX) ? clamp(EYE_CAL_PX / d.eyeOuterPx, 0.85, 1.15) : 1.0;
                  let ipdMm = d.ipdPx * pxToMm * yawFactor;

                  if (Number.isFinite(ipdMm) && ipdMm >= 40 && ipdMm <= 85) {
                    const shown = smooth(ipdMm);
                    lbl.textContent = `IPD: ${shown.toFixed(1)} mm${PX_TO_MM ? " (card)" : " (fallback)"}`;
                    if ((frameCounter++ % 6) === 0) window.callUnity(lbl.textContent);
                  } else {
                    lbl.textContent = "IPD: (kalitesiz kare)";
                  }
                } else {
                  lbl.textContent = "IPD: (kalitesiz kare)";
                }
              } else {
                lbl.textContent = "IPD: (yüz yok)";
              }
            }
            video.requestVideoFrameCallback(ipdLoop);
          }
          video.requestVideoFrameCallback(ipdLoop);
        })
        .catch((message) => { alert(message); });
    };
    document.body.appendChild(script);
  </script>

  <button onclick="callUnity('Hello from HTML/JS!')">Unity'ye Mesaj Gönder</button>
</body>

</html>
