<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity Web Player | TestBridge</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"> </div>
    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">TestBridge</div>
    </div>
  </div>
  <script>
    // ───────────────────────────
    // Unity loader
    // ───────────────────────────
    var canvas = document.querySelector("#unity-canvas");

    // Shows a temporary message banner/ribbon for a few seconds, or
    // a permanent error message on top of the canvas if type=='error'.
    // If type=='warning', a yellow highlight color is used.
    // Modify or remove this function to customize the visually presented
    // way that non-critical warnings and error messages are presented to the
    // user.
    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/bld.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/bld.data",
      frameworkUrl: buildUrl + "/bld.framework.js",
      codeUrl: buildUrl + "/bld.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "TestBridge",
      productVersion: "0.1.0",
      showBanner: unityShowBanner,
      // errorHandler: function(err, url, line) {
      //    alert("error " + err + " occurred at line " + line);
      //    // Return 'true' if you handled this error and don't want Unity
      //    // to process it further, 'false' otherwise.
      //    return true;
      // },
    };

    // By default, Unity keeps WebGL canvas render target size matched with
    // the DOM size of the canvas element (scaled by window.devicePixelRatio)
    // Set this to false if you want to decouple this synchronization from
    // happening inside the engine, and you would instead like to size up
    // the canvas DOM size and WebGL render target sizes yourself.
    // config.matchWebGLToCanvasSize = false;

    // If you would like all file writes inside Unity Application.persistentDataPath
    // directory to automatically persist so that the contents are remembered when
    // the user revisits the site the next time, uncomment the following line:
    // config.autoSyncPersistentDataPath = true;
    // This autosyncing is currently not the default behavior to avoid regressing
    // existing user projects that might rely on the earlier manual
    // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
    // expected to change.

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      // Mobile device style: fill the whole browser client area with the game canvas:

      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";

      // To lower canvas resolution on mobile devices to gain some
      // performance, uncomment the following line:
      // config.devicePixelRatio = 1;


    } else {
      // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
      canvas.style.width = "960px";
      canvas.style.height = "600px";
    }
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width = (100 * progress) + "%";
      })
        .then(async (unityInstance) => {
          // Unity hazır
          window.unityInstance = unityInstance;
          console.log("[PageJS] Unity hazır.");

          // UI: Loading & Fullscreen
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };

          // JS → Unity helper
          window.callUnity = function (msg) {
            try {
              if (!window.unityInstance) return console.warn("Unity hazır değil!");
              window.unityInstance.SendMessage("Bridge", "OnMessage", String(msg));
            } catch (e) { console.error("Unity'ye mesaj giderken hata:", e); }
          };

          // ───────────────────────────
          // UI: IPD etiketi + Kalibrasyon butonu
          // ───────────────────────────
          const bar = document.createElement("div");
          Object.assign(bar.style, {
            position: "fixed", right: "12px", top: "12px", zIndex: 9999,
            display: "flex", gap: "8px", alignItems: "center"
          });
          const lbl = document.createElement("div");
          Object.assign(lbl.style, {
            padding: "8px 10px", background: "rgba(0,0,0,.6)", color: "#fff",
            fontFamily: "monospace", fontSize: "14px", borderRadius: "8px",
          });
          lbl.textContent = "IPD: --";
          const btn = document.createElement("button");
          btn.textContent = "Kalibre (Kart)";
          Object.assign(btn.style, {
            padding: "8px 10px", borderRadius: "8px", border: "none",
            background: "#222", color: "#fff", cursor: "pointer"
          });
          bar.appendChild(lbl);
          bar.appendChild(btn);
          document.body.appendChild(bar);

          // ───────────────────────────
          // Video + Overlay Canvas (kalibrasyon için)
          // ───────────────────────────
          const W = 640, H = 480;
          const video = document.createElement("video");
          video.autoplay = true; video.playsInline = true; video.muted = true;
          video.width = W; video.height = H;
          Object.assign(video.style, {
            position: "fixed", left: "12px", bottom: "12px", width: "320px",
            height: "240px", borderRadius: "8px", boxShadow: "0 0 12px rgba(0,0,0,.25)",
            display: "none", zIndex: 9998, background: "#000"
          });
          document.body.appendChild(video);

          const overlay = document.createElement("canvas");
          overlay.width = W; overlay.height = H;
          Object.assign(overlay.style, {
            position: "fixed", left: "12px", bottom: "12px", width: "320px",
            height: "240px", borderRadius: "8px", display: "none", zIndex: 9999,
            pointerEvents: "auto"
          });
          document.body.appendChild(overlay);
          const ox = overlay.getContext("2d");

          // Kamera aç
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: W, height: H }, audio: false });
            video.srcObject = stream;
            await video.play();
          } catch (err) {
            console.error("Kamera izni/erişimi hatası:", err);
            lbl.textContent = "IPD: (kamera hatası)";
            return;
          }

          // ───────────────────────────
          // MediaPipe (FaceLandmarker)
          // ───────────────────────────
          const visionWasm = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm";
          const modelUrl = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
          const { FilesetResolver, FaceLandmarker } = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest");
          const fs = await FilesetResolver.forVisionTasks(visionWasm);
          const landmarker = await FaceLandmarker.createFromOptions(fs, {
            baseOptions: { modelAssetPath: modelUrl },
            runningMode: "VIDEO",
            numFaces: 1
          });

          // ───────────────────────────
          // IPD hesap
          // ───────────────────────────
          const LEFT_IRIS = [468, 469, 470, 471, 472];
          const RIGHT_IRIS = [473, 474, 475, 476, 477];

          const SMA_N = 10;
          const ipdMmQueue = [];
          let frameCount = 0;

          // Kalibrasyon katsayıları
          let CAL_K = 1.00;   // manuel çarpan (ince ayar)
          let PX_TO_MM = null; // kredi kartından türetilen ölçek (mm/px)
          window.setCal = (k) => { CAL_K = Number(k) || 1.0; };

          function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
          function avgPts(pts) { let sx = 0, sy = 0; for (const p of pts) { sx += p.x; sy += p.y; } const n = pts.length || 1; return { x: sx / n, y: sy / n }; }
          function dist(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return Math.hypot(dx, dy); }

          function computeIpdMm(landmarks) {
            if (!landmarks || landmarks.length < 478) return null;

            // Normalized [0..1] → px
            const toPx = (p) => ({ x: clamp(p.x, 0, 1) * W, y: clamp(p.y, 0, 1) * H });

            const leftIris = LEFT_IRIS.map(i => toPx(landmarks[i]));
            const rightIris = RIGHT_IRIS.map(i => toPx(landmarks[i]));
            const lc = avgPts(leftIris);
            const rc = avgPts(rightIris);
            const ipdPx = dist(lc, rc);

            // Ölçek: 1) Kart kalibrasyonu varsa onu kullan
            if (PX_TO_MM && Number.isFinite(PX_TO_MM)) {
              let mm = ipdPx * PX_TO_MM * CAL_K;
              if (mm < 40 || mm > 85) return null;
              return mm;
            }

            // 2) Aksi halde iris-çapı (11.7mm) tahmini
            const lR = leftIris.reduce((s, p) => s + dist(lc, p), 0) / leftIris.length;
            const rR = rightIris.reduce((s, p) => s + dist(rc, p), 0) / rightIris.length;
            const irisDiamPx = 2 * ((lR + rR) * 0.5);
            if (irisDiamPx < 1) return null;
            const MM_PER_PX = 11.7 / irisDiamPx;
            let ipdMm = ipdPx * MM_PER_PX * CAL_K;
            if (!Number.isFinite(ipdMm) || ipdMm < 40 || ipdMm > 85) return null;
            return ipdMm;
          }

          function pushAndSmooth(mm) {
            ipdMmQueue.push(mm);
            if (ipdMmQueue.length > SMA_N) ipdMmQueue.shift();
            const sum = ipdMmQueue.reduce((a, b) => a + b, 0);
            return sum / ipdMmQueue.length;
          }

          // ───────────────────────────
          // Kalibrasyon (Kredi Kartı)
          // ───────────────────────────
          let calActive = false;
          btn.onclick = () => {
            if (calActive) return;
            calActive = true;
            // Videoyu ve overlay'i göster
            video.style.display = "block";
            overlay.style.display = "block";
            // Overlay'i temizle ve yönerge yaz
            ox.clearRect(0, 0, overlay.width, overlay.height);
            ox.fillStyle = "rgba(0,0,0,.4)";
            ox.fillRect(0, 0, overlay.width, overlay.height);
            ox.fillStyle = "#fff";
            ox.font = "16px monospace";
            ox.fillText("Kartı göz hizasına ve kameraya paralel tutun.", 16, 28);
            ox.fillText("Kartın SOL ve SAĞ kenarına sırasıyla tıklayın.", 16, 52);
            ox.fillText("Standart genişlik: 85.60 mm", 16, 76);

            let clicks = [];
            function drawMarker(px, py) {
              ox.beginPath(); ox.arc(px, py, 6, 0, Math.PI * 2);
              ox.fillStyle = "#ffcc00"; ox.fill();
              ox.beginPath(); ox.arc(px, py, 12, 0, Math.PI * 2);
              ox.strokeStyle = "#ffcc00"; ox.lineWidth = 2; ox.stroke();
            }

            function toCanvasXY(ev) {
              // CSS scaled canvas → gerçek canvas koordinatı
              const r = overlay.getBoundingClientRect();
              const nx = (ev.clientX - r.left) / r.width;
              const ny = (ev.clientY - r.top) / r.height;
              return { x: nx * overlay.width, y: ny * overlay.height };
            }

            function onClick(ev) {
              const p = toCanvasXY(ev);
              clicks.push(p);
              drawMarker(p.x, p.y);
              if (clicks.length === 2) {
                overlay.removeEventListener("click", onClick);
                // Yatay mesafe (kenardan kenara)
                const dx = Math.abs(clicks[1].x - clicks[0].x);
                if (dx < 20) {
                  lbl.textContent = "IPD: (kalibrasyon başarısız: küçük mesafe)";
                } else {
                  PX_TO_MM = 85.60 / dx; // mm/px
                  lbl.textContent = "IPD: -- (kalibreli)";
                  console.log("[Cal] PX_TO_MM =", PX_TO_MM.toFixed(6), "mm/px");
                }
                // Overlay’i kapat
                setTimeout(() => {
                  video.style.display = "none";
                  overlay.style.display = "none";
                  calActive = false;
                }, 400);
              }
            }
            overlay.addEventListener("click", onClick);
          };

          // ───────────────────────────
          // Frame döngüsü
          // ───────────────────────────
          let lastTs = -1;
          async function tick() {
            if (video.readyState >= 2) {
              const ts = performance.now();
              if (lastTs === -1) lastTs = ts;

              const res = landmarker.detectForVideo(video, ts);
              const faces = res?.faceLandmarks;
              if (faces && faces.length > 0) {
                const ipdMm = computeIpdMm(faces[0]);
                if (ipdMm) {
                  const smoothed = pushAndSmooth(ipdMm);
                  const shown = smoothed ?? ipdMm;
                  const tag = PX_TO_MM ? " (kalibreli)" : "";
                  const text = `IPD: ${shown.toFixed(1)} mm${tag}`;
                  lbl.textContent = text;

                  if ((frameCount++ % 5) === 0) {
                    window.callUnity(text);
                  }
                } else {
                  lbl.textContent = "IPD: (kalitesiz kare)";
                }
              } else {
                lbl.textContent = "IPD: (yüz yok)";
              }
            }
            requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);

          // // İnce ayar istersen:
          // window.setCal(1.02); // %2 büyüt
          // window.setCal(0.98); // %2 küçült
        })
        .catch((message) => {
          alert(message);
        });
    };
    document.body.appendChild(script);
  </script>
  <button onclick="callUnity('Hello from HTML/JS!')">Unity'ye Mesaj Gönder</button>
</body>

</html>
